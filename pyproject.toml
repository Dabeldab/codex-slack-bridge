[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "codex-slack-bridge"
version = "0.1.0"
description = "Slack bridge workspace with agent integration"
requires-python = ">=3.10"
dependencies = [
  "slack-bolt>=1.17.0",
  "pyyaml>=6.0",
  "psycopg2-binary>=2.9.0",
  "sqlalchemy>=2.0.0",
  "google-cloud-storage>=2.0.0",
  "google-cloud-firestore>=2.14.0",
  "google-auth>=2.0.0",
  "google-auth-oauthlib>=1.0.0,<2.0.0",
  "paramiko>=4.0.0,<6.0.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=43,<47",
  "mcp[cli]==1.28.1",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=3.0.0",
  "black>=22.0.0",
  "ruff>=0.0.200",
  "mypy>=0.900",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
