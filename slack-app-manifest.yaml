display_information:
  name: Codex Bridge
  description: Local Codex CLI and ChatGPT bridge for coding and support channels.
features:
  bot_user:
    display_name: Codex Bridge
    always_online: true
  slash_commands:
    - command: /btw
      description: Queue steering guidance for the agent assigned to this channel.
      usage_hint: <guidance for the agent>
      should_escape: false
    - command: /steer
      description: Queue steering guidance for the agent assigned to this channel.
      usage_hint: <guidance for the agent>
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
