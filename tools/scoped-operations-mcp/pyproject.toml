[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-operations-mcp"
version = "0.1.0"
description = "Typed least-privilege provider operations for Nova agents."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "google-auth>=2.30,<3",
  "mcp[cli]==1.28.1",
  "openpyxl>=3.1,<4",
  "pyodbc>=5,<6",
  "python-dotenv>=1.0,<2",
  "pywin32>=306; platform_system == 'Windows'",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "pyyaml>=6,<7"]

[project.scripts]
salesforce-scoped-mcp = "scoped_operations_mcp.salesforce_server:main"
maxio-scoped-mcp = "scoped_operations_mcp.maxio_server:main"
zoom-scoped-mcp = "scoped_operations_mcp.zoom_server:main"
cloud-ops-scoped-mcp = "scoped_operations_mcp.cloud_ops_server:main"
rory-operator-services-mcp = "scoped_operations_mcp.operator_services_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoped_operations_mcp = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
