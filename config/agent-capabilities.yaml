# metrics and exact-recipient send in the support lane.
schema_version: 2

global:
  # Both verified and untrusted child processes receive scrubbed environments;
  # typed brokers/connectors retain the credentials needed for approved work.
  child_secret_mode: scrub
  forbidden_operations:
    - salesforce.delete_record
    - maxio.delete_record
    - chargify.delete_record
  # The authenticated operator-only Rory lane may execute an exact operator
  # request through its isolated provider broker. These global names continue
  # to constrain every delegated/automatic lane.
  operator_exemptions: [direct_codex]
  delegation_rule: reduce_only
  # Only the operator-only Rory lane may administer capability contracts, and
  # only when the authenticated operator explicitly requests the exact change.
  # Delegated, scheduled, background, and specialist self-service changes remain
  # forbidden.
  agent_may_change_access: operator_only
  capability_source: authenticated_mcp_registry
  forbidden_surfaces:
    - rescue.write
    - salesforce.apex
    - salesforce.delete
    - salesforce.flow
    - salesforce.metadata
    - salesforce.permissions
    - salesforce.settings
    - salesforce.tooling
    - salesforce.user_admin
    - salesforce.workflow
    - salesforce.arbitrary_rest
    - salesforce.arbitrary_soql
    - nova_sql.unapproved_write

