# AgentChat/direct_codex 2026-08-01T13:50:00Z: enable only tracked Thor support-quality repair handoffs to Taylor.
# AgentChat/coding_agent 2026-08-03T22:55:08Z: add the fixed guarded Nova location reactivation route.
