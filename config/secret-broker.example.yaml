# Policy only: never place credential values in this file.
# Keep the broker, provider, and each operation disabled until its isolated
# broker service and code-registered handler have been deployed and reviewed.
schema_version: 1
enabled: false

providers:
  google-primary:
    type: google_secret_manager
    enabled: false
    project_id: supportkpis

  local-transition:
    type: environment
    enabled: false
    transitional: true

operations:
  google_drive.read_document:
    enabled: false
    provider: google-primary
    # The authenticated broker transport supplies agent name, job id, and
    # request id; never trust an agent-authored identity string. The broker
    # records those correlation fields without recording arguments.
    allowed_agents:
      - taylor
    reference:
      secret_id: bridge-google-drive-oauth
      # Numeric version pins are required; aliases such as latest are rejected.
      version: "1"
    arguments:
      required:
        - document_id
      optional:
        - include_metadata
