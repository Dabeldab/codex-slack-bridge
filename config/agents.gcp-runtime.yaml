# Private GCP agent runtime overlay. It inherits the production lane definitions
# and Slack routing while replacing Windows paths and disabling every automatic
# writer until the controlled cutover enables the systemd services.
# AgentChat/coding_agent 2026-07-30T17:15:00Z: persist verified routes in private runtime state.
extends: agents.yaml

defaults:
  # AgentChat/direct_codex 2026-07-29T20:35:00-04:00: match model cost/latency to demand without changing lane access.
  model_autoselect: true
  model_fast: "gpt-5.6-terra"
  model_quality: "gpt-5.6-sol"
  command_center_provider_readiness_enabled: true
  command_center_provider_readiness_success_ttl_seconds: 300
  command_center_provider_readiness_failure_ttl_seconds: 30
  command_center_provider_readiness_probe_timeout_seconds: 10
  runtime_mode: primary
  workspace_root: "/srv/nova/workspaces"
  state_db: "/var/lib/nova/state/bridge.sqlite3"
  max_workers: 3
  verified_route_store_path: "/var/lib/nova/state/agent_runtime/verified_routes.sqlite3"

  agent_runtime_session_store_path: "/var/lib/nova/state/agent_runtime/sessions.jsonl"
  agent_runtime_lock_root: "/var/lib/nova/state/agent_runtime/locks"
  capability_state_path: "/var/lib/nova/state/agent_runtime/capabilities.json"
  agent_runtime_restart_request_path: "/var/lib/nova/state/agent_runtime/restart_request.json"
  agent_sandbox_root: "/srv/nova/sandboxes"
  agent_sandbox_cleanup_log_path: "/var/log/nova/cleanup/agent_sandbox_cleanup.jsonl"
  operator_message_signing_key_path: "/run/nova-runtime/operator_message.key"
  command_center_url: "http://127.0.0.1:17866"
  command_center_data_root: "/var/lib/nova/state/command_center"
  command_center_pause_manifest_path: "/var/lib/nova/state/command_center/restart_manifest.json"
  command_center_auth_enabled: true
  command_center_google_auth_enabled: false
  command_center_session_token_path: "/run/nova-runtime/command-center-session.token"

  memory_sqlite_path: "/var/lib/nova/state/memory.sqlite3"
  desktop_vector_memory_path: "/var/lib/nova/state/memory_vectors.json"
  memory_desktop_json_mirror: false
  memory_lancedb_path: "/var/lib/nova/state/lancedb"
  cognitive_memory_sqlite_path: "/var/lib/nova/state/cognitive_memory.sqlite3"
  learning_registry_sqlite_path: "/var/lib/nova/state/learning_registry.sqlite3"
  prospective_sqlite_path: "/var/lib/nova/state/prospective.sqlite3"
  drawing_board_sqlite_path: "/var/lib/nova/state/drawing_board.sqlite3"
  shared_chat_log_path: "/var/lib/nova/state/shared_chat/events.jsonl"
  artifact_index_path: "/var/lib/nova/state/agent_artifacts/index.jsonl"
  pipeline_cache_root: "/var/lib/nova/state/pipeline_cache"
  slack_file_download_dir: "/srv/nova/attachments/slack"
  slack_file_output_dir: "/var/lib/nova/slack/generated"
  slack_file_upload_allowed_roots:
    - "/srv/nova/workspaces"
    - "/var/lib/nova/slack/files"
    - "/var/lib/nova/slack/generated"
    - "/var/lib/nova/broker/maxio-reports"
  agent_file_return_max_mb: 25
  agent_file_return_allowed_roots:
    - "/var/lib/nova/slack/generated"
    - "/var/lib/nova/broker/maxio-reports"

  # Provider secrets are available only to root-owned startup materialization
  # and typed broker identities. Model processes receive no vault or raw secret
  # path and cannot reach the GCE metadata service.
  suppress_private_runtime_paths: true
  credential_vault_path: ""
  credential_vault_tool: ""
  google_drive_adc_path: ""
  google_drive_oauth_client_path: ""
  edge_browser_tool: ""
  google_drive_tool: ""
  gcloud_ops_tool: ""

  ops_gmail_oauth_token_path: "/var/lib/nova/gmail/token.json"
  ops_email_send_journal_path: "/var/lib/nova/state/command_center/email_send_journal.json"
  ops_inbox_ledger_path: "/var/lib/nova/state/command_center/inbox_work.sqlite3"
  ops_salesforce_work_ledger_path: "/var/lib/nova/state/command_center/salesforce_work.sqlite3"
  # Alex writes only a per-run ticket snapshot here. The nova-runtime
  # supervisor validates and atomically promotes it into Command Center state.
  ops_ticket_refresh_output_root: "/srv/nova/workspaces/alex/command-center-output/ticket-refresh"
  agent_chat_attachment_dir: "/srv/nova/attachments/command-center"
  command_center_job_retention_count: 500
  command_center_job_retention_days: 30

  voice_room_enabled: false
  local_voice_room_enabled: false
  # The durable Gmail ledger and guarded Salesforce ticket-cache refresh are
  # the background ingress paths allowed after the production cutover override
  # removes COMMAND_CENTER_DISABLE_WATCHERS. Legacy mail watchers remain off
  # and must never fail open in cloud.
  ops_inbox_ledger_enabled: true
  ops_inbox_ledger_fail_open_to_legacy: false
  ops_support_email_intake_enabled: true
  ops_support_email_intake_interval_seconds: 300
  ops_support_email_intake_max_results: 300
  ops_support_email_intake_query: "in:inbox is:unread -from:integration@novapointofsale.com -to:integration@novapointofsale.com -deliveredto:integration@novapointofsale.com -in:spam -in:trash"
  ops_support_email_ticket_created_by: "Darius Parlor"
  ops_support_email_idempotency_seconds: 2592000
  ops_support_email_salesforce_readback_executor: "/opt/nova/bin/run-salesforce-support-email-readback"
  ops_email_watch_enabled: false
  ops_schedule_watch_enabled: false
  ops_ticket_refresh_enabled: true
  ops_ticket_refresh_interval_seconds: 900
  ops_salesforce_delta_enabled: false
  ops_kpi_dashboard_enabled: false
  ops_propelr_nmi_enabled: false
  ops_singapore_ftp_enabled: true
  ops_singapore_ftp_include_non_submissions: true
  ops_singapore_ftp_executor: "/opt/nova/bin/run-singapore-background"
  ops_singapore_ftp_uploader_root: "/opt/nova/components/singapore/current"
  ops_singapore_ftp_state_dir: "/var/lib/nova/broker/singapore"
  ops_singapore_ftp_server_config_path: "/var/lib/nova/broker/singapore/servers.json"
  ops_singapore_ftp_ops_env_path: "/var/lib/nova/broker/singapore/ops.env"
  ops_singapore_ftp_result_path: "/var/lib/nova/broker/singapore-shared/ops_singapore_ftp.json"
  salesforce_ticket_close_executor: "/opt/nova/bin/run-salesforce-ticket-close"
  nova_location_region_executor: "/opt/nova/bin/run-nova-location-region"
  # AgentChat/direct_codex 2026-07-24T13:45:00Z: the support lane now has
  # typed Salesforce totals plus journaled Zoom metrics/send operations.
  ops_weekly_yaron_report_enabled: true
  ops_weekly_yaron_report_interval_seconds: 900
  ops_weekly_yaron_report_weekday: "friday"
  ops_weekly_yaron_report_local_time: "08:00"
  ops_weekly_yaron_report_timezone: "America/New_York"
  ops_weekly_yaron_report_recipient_hint: "Yaron"
  ops_weekly_yaron_report_queue_hint: "All queues / fixed Total Calls report roster"
  ops_weekly_yaron_report_output_path: "/srv/nova/workspaces/alex/command-center-output/weekly-report/ops_weekly_yaron_report.json"
  ops_weekly_yaron_report_idempotency_seconds: 604800
  # Tech Time meets Wednesdays at 13:00 America/New_York. Run Thor four hours
  # earlier so the sanitized agenda is ready; the manual run remains available.
  ops_weekly_support_quality_enabled: true
  ops_weekly_support_quality_interval_seconds: 900
  ops_weekly_support_quality_weekday: "Wednesday"
  ops_weekly_support_quality_local_time: "09:00"
  ops_weekly_support_quality_timezone: "America/New_York"
  ops_weekly_support_quality_output_path: "/var/lib/nova/state/command_center/ops_weekly_support_quality.json"
  ops_weekly_support_quality_salesforce_projection_executor: "/opt/nova/bin/run-salesforce-support-quality-projection"
  ops_weekly_support_quality_prior_weeks: 8
  ops_weekly_support_quality_idempotency_seconds: 604800
  ops_zoom_chat_monitor_enabled: false
  ops_zoom_chat_monitor_path: "/var/lib/nova/broker/zoom-shared/zoom_chat_monitor.json"
  drawing_board_digest_enabled: false
  prospective_enabled: true
  desktop_slack_mirror_enabled: false

agents:
  direct_codex:
    workspace_root: "/srv/nova/workspaces/rory"
    codex_executable: "/usr/local/bin/codex"
    codex_command_prefix: ["/usr/bin/sudo", "-n", "-H", "-u", "nova-rory", "--"]
    codex_mcp_config_path: "/etc/nova/codex-mcp-policy/rory.toml"
    runtime_file_group: "nova-rory"
    mcp_allowlist:
      - openaiDeveloperDocs
      - gcp_github_ops
      - rory_operator_ops
      - salesforce_operator_ops
      - zoom_operator_ops

  raw_codex:
    workspace_root: "/srv/nova/workspaces/raw"
    codex_executable: "/usr/local/bin/codex"
    codex_command_prefix: ["/usr/bin/sudo", "-n", "-H", "-u", "nova-raw", "--"]
    codex_mcp_config_path: "/etc/nova/codex-mcp-policy/raw.toml"
    runtime_file_group: "nova-raw"
    mcp_allowlist: []

  coding_agent:
    workspace_root: "/srv/nova/workspaces/taylor"
    codex_executable: "/usr/local/bin/codex"
    codex_command_prefix: ["/usr/bin/sudo", "-n", "-H", "-u", "nova-taylor", "--"]
    codex_mcp_config_path: "/etc/nova/codex-mcp-policy/taylor.toml"
    runtime_file_group: "nova-taylor"
    mcp_allowlist:
      - openaiDeveloperDocs
      - gcp_github_ops
      - salesforce_coding_ops
      - maxio_coding_ops
      - zoom_coding_ops

  tickets_agent:
    workspace_root: "/srv/nova/workspaces/alex"
    codex_executable: "/usr/local/bin/codex"
    codex_command_prefix: ["/usr/bin/sudo", "-n", "-H", "-u", "nova-alex", "--"]
    codex_mcp_config_path: "/etc/nova/codex-mcp-policy/alex.toml"
    runtime_file_group: "nova-alex"
    mcp_allowlist:
      - openaiDeveloperDocs
      - rescue_console
      - salesforce_support_ops
      - zoom_support_ops

  billing_agent:
    workspace_root: "/srv/nova/workspaces/jamie"
    codex_executable: "/usr/local/bin/codex"
    codex_command_prefix: ["/usr/bin/sudo", "-n", "-H", "-u", "nova-jamie", "--"]
    codex_mcp_config_path: "/etc/nova/codex-mcp-policy/jamie.toml"
    runtime_file_group: "nova-jamie"
    mcp_allowlist:
      - openaiDeveloperDocs
      - salesforce_billing_ops
      - maxio_billing_ops
      - zoom_billing_ops

  # Compatibility paths retain "claude"; the authenticated visible lane is
  # Thor — Support Quality and never borrows another agent's Codex identity.
  claude_agent:
    provider: codex_cli
    codex_fallback_home: "${CODEX_FALLBACK_HOME}"
    workspace_root: "/srv/nova/workspaces/claude"
    codex_executable: "/usr/local/bin/codex"
    codex_command_prefix: ["/usr/bin/sudo", "-n", "-H", "-u", "nova-claude", "--"]
    codex_mcp_config_path: "/etc/nova/codex-mcp-policy/claude.toml"
    runtime_file_group: "nova-claude"
    mcp_allowlist:
      - rescue_console
      - zoom_quality_ops
      - salesforce_ticket_reads
      - google_drive_support_reads
    extra_args: []
