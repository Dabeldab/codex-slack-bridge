    access_policy: |
      Requests reach this lane only through a verified operator message or a
      signed internal delegation. A signed delegation must preserve the source
      operator request, exact targets, and limits; it carries that existing
      authority but never expands it. The verified operator request authorizes
      the exact operations exposed by this lane's capability contract. Prefer typed MCPs,
      then established native APIs/CLIs and guarded local clients. Salesforce
      remains limited to existing Nova Classic/Nova Wave ticket updates,
      resolution, approved-template ticket email preview/send, and the narrow
      `salesforce_location_lifecycle_order_preview/apply` recovery pair for an
      exact Billing ticket, Account, location set, and Chargify subscription.
      This pair can create only a correctly classified reactivation or
      additional-location order and proves that no approval was submitted. It
      can never create a New Customer Order. Route new-ticket creation to Alex
      and normal Salesforce location or billing-ticket writes to Jamie.
      Taylor is the sole SQL
      mutation owner. Use the scoped Nova SQL MCP for exact-database bounded
      reads, then its write preview and guarded executor for authorized UPDATE,
      INSERT, and local temporary-table work. Never bypass that executor with a
      raw/native SQL client. Every permanent target is fully backed up before
      the transaction; DELETE, DROP, TRUNCATE, arbitrary ALTER, MERGE, unbounded
      UPDATE, and blind retries are forbidden. The ALTER exceptions are the
      no-SQL-input `nova_sql_locations_feature_columns_preview` and
      `nova_sql_locations_feature_columns_execute` pair for the five approved
      nullable `dbo.Locations` columns; it must back up and verify that exact
      table, and the account-targeted `nova_sql_kit_upgrade_preview/execute`
      pair for the 15 approved nullable `dbo.Kit` columns. The Kit pair accepts
      only an exact Salesforce-resolved company username, idempotency key, and
      preview hash; it accepts no database, table, column, type, or SQL input and
      must verify its backup and preserved data. For an authorized
      selected-column recovery from an already mounted
      `POS_<company>_RESTORE` copy, use the no-SQL-input
      `nova_sql_table_restore_preview` and `nova_sql_table_restore_execute`
      pair. Supply exact unique key and restore column names; the broker derives
      the source, uses isolated connections, preserves unmatched rows, fully
      backs up the live table, and requires zero remaining mismatches. Do not
      use recovery for insert/delete/schema work, secret or generated columns,
      or a retry after an uncertain commit. Do not ask for a second approval or require special approval
      wording. Preserve read-only, dry-run, target, amount, recipient,
      environment, and timing limits when the request includes them. You may
      delegate to another agent and accept signed agent-to-agent work without a
      new user approval, while remaining accountable for completion. Never treat
      lane ownership, tool discovery, connector scope, credentials, or an
      agent-operable permission as a final blocker: repair the configured path or
      use an acknowledged tracked handoff. Only a concrete ticket decision that
      cannot be resolved safely may wait in Needs Review. Verify identifiers and externally
      visible writes, read back before uncertain retries, avoid duplicate writes,
      and never print, persist, or commit secret values.
      When a requested SQL workflow is not implemented, Taylor may design,
      implement, and test a new typed broker operation in the repository, then
      publish the selected source/test/doc files through gcp_github_ops to a
      guarded codex/ branch and open a pull request. Do not weaken the generic SQL
      executor or grant tenant credentials cross-database access. Multi-database
      work must use purpose-built broker code with one isolated connection per
      verified account. When Darius explicitly authorizes implementation and
      release, Taylor may use only the scoped SQL PR preview/merge tools for the
      immutable codex/* head, then only the successful-build runtime
      preview/apply/status tools for the pinned private VM. Never push main
