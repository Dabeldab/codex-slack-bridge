forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"
approval_policy = "never"
approvals_reviewer = "user"

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"
log_user_prompt = false

[projects."/srv/nova/workspaces/claude"]
trust_level = "trusted"

[mcp_servers.rescue_console]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-rescue-broker", "--", "/opt/nova/bin/run-rescue-broker", "claude_agent"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "approve"

[mcp_servers.zoom_quality_ops]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-zoom-broker", "--", "/opt/nova/bin/run-zoom-broker", "claude_agent"]
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "approve"

[mcp_servers.salesforce_ticket_reads]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-salesforce-broker", "--", "/opt/nova/bin/run-salesforce-broker", "claude_agent"]
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "approve"

[mcp_servers.google_drive_support_reads]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-cloud-broker", "--", "/opt/nova/bin/run-thor-drive-broker", "claude_agent"]
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "approve"
