forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"
approval_policy = "never"
approvals_reviewer = "user"

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"
log_user_prompt = false

[projects."/srv/nova/workspaces/rory"]
trust_level = "trusted"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
default_tools_approval_mode = "approve"

[mcp_servers.gcp_github_ops]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-cloud-broker", "--", "/opt/nova/bin/run-cloud-ops-broker", "direct_codex"]
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "approve"

[mcp_servers.rory_operator_ops]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-cloud-broker", "--", "/opt/nova/bin/run-operator-broker", "direct_codex"]
startup_timeout_sec = 30
tool_timeout_sec = 300
default_tools_approval_mode = "approve"

[mcp_servers.salesforce_operator_ops]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-salesforce-broker", "--", "/opt/nova/bin/run-salesforce-broker", "direct_codex"]
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "approve"

[mcp_servers.zoom_operator_ops]
command = "/usr/bin/sudo"
args = ["-n", "-H", "-u", "nova-zoom-broker", "--", "/opt/nova/bin/run-zoom-broker", "direct_codex"]
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "approve"
